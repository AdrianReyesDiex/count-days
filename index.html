<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta regresiva</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1f; --muted: #6e6e73; --card: #fff; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --fg: #f2f2f2; --muted: #9a9aa0; --card: #1c1c1f; --accent: #fb923c; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  h1 { font-size: clamp(1.4rem, 4vw, 2.2rem); margin: 0 0 .25em; }
  p { color: var(--muted); margin: 0 0 2em; }
  #contador { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 640px; margin: 0 auto; }
  @media (max-width: 480px) { #contador { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .caja { background: var(--card); border-radius: 16px; padding: 20px 8px; }
  .num { display: block; font-size: clamp(2.2rem, 9vw, 3.6rem); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
  .lbl { font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  #listo { font-size: clamp(1.8rem, 6vw, 3rem); font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Cuenta regresiva</h1>
  <p>14 de noviembre de 2026 · 12:00 p.m. (hora del Pacífico, Tijuana)</p>
  <div id="contador" role="timer" aria-live="off">
    <div class="caja"><span class="num" id="d">0</span><span class="lbl">días</span></div>
    <div class="caja"><span class="num" id="h">00</span><span class="lbl">horas</span></div>
    <div class="caja"><span class="num" id="m">00</span><span class="lbl">minutos</span></div>
    <div class="caja"><span class="num" id="s">00</span><span class="lbl">segundos</span></div>
  </div>
  <div id="listo" hidden>¡Llegó el día! 🎉</div>
</main>
<script>
  // Hora fija con offset, así marca lo mismo sin importar la zona horaria de quien lo abra (PST, el horario de verano termina el 1 de nov).
  const META = new Date('2026-11-14T12:00:00-08:00');

  function partes(ms) {
    const t = Math.floor(ms / 1000);
    return [Math.floor(t / 86400), Math.floor(t / 3600) % 24, Math.floor(t / 60) % 60, t % 60];
  }
  console.assert(partes(90061000).join() === '1,1,1,1', 'partes() falló');

  const dos = n => String(n).padStart(2, '0');
  function tick() {
    const falta = META - Date.now();
    if (falta <= 0) {
      document.getElementById('contador').hidden = true;
      document.getElementById('listo').hidden = false;
      return clearInterval(timer);
    }
    const [d, h, m, s] = partes(falta);
    document.getElementById('d').textContent = d;
    document.getElementById('h').textContent = dos(h);
    document.getElementById('m').textContent = dos(m);
    document.getElementById('s').textContent = dos(s);
  }
  const timer = setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
